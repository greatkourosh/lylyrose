; LYLY ROSE
; Increases PHP limits for media uploads (perfume imagery, product galleries).
; Applied to the WordPress container via /usr/local/etc/php/conf.d/uploads.ini

memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_file_uploads = 20
upload_max_filesize = 64M
post_max_size = 128M

; The project bind-mounts wp-content from Windows. Avoid a filesystem stat for
; every PHP file on each request; restart the container after PHP code changes.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.max_accelerated_files = 20000