services:
  wordpress:
    # Build on the aroma_store-wordpress image: it already has the PHP redis
    # extension compiled. The build overlays WordPress 7.1 core on top, because
    # the 6.5 core that base image ships predates the
    # WP_Block_Templates_Registry class WooCommerce 11.1.0 calls, and a fresh
    # volume would fatal on the first WooCommerce page.
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: lylyrose-wordpress:local
    container_name: lylyrose-wp
    restart: unless-stopped
    ports:
      - "${WORDPRESS_PORT:-8030}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "${WORDPRESS_DEBUG:-0}"
      # WordPress emits absolute URLs, so any host pinned here becomes the host
      # every CSS/JS/image request is sent to -- and a pinned host that only
      # resolves on this machine renders the site unstyled on every other LAN
      # device. Derive it from the incoming request instead, so the same site is
      # reachable as http://192.168.1.13:8030 from a phone and as
      # https://lylyrose.local through the Caddy proxy.
      #
      # HTTP_HOST is client-controlled, so it is matched against an allowlist
      # rather than trusted: the canonical host, localhost, and bare IP
      # literals. Everything else falls back -- notably the `wordpress` service
      # name the cron container calls, which would otherwise make every URL
      # generated during a cron run point at http://wordpress/.
      # $_SERVER['HTTPS'] is already normalized from X-Forwarded-Proto by
      # wp-config-docker.php above. Literal $$ escapes compose interpolation.
      #
      # COOKIEHASH must stay fixed: WordPress derives it from siteurl, so leaving
      # it derived would name the login cookie after whichever host made the
      # request. A cookie minted over the LAN would then be rejected by the
      # proxy and vice versa, and every CLI process -- which has no HTTP_HOST at
      # all -- would compute yet another name and never authenticate.
      WORDPRESS_CONFIG_EXTRA: |
        $$lr_host = isset($$_SERVER['HTTP_HOST']) ? strtolower($$_SERVER['HTTP_HOST']) : '';
        $$lr_name = '';
        if (preg_match('/^\[([^\]]+)\](:[0-9]{1,5})?$$/', $$lr_host, $$m)) {
          $$lr_name = $$m[1];
        } elseif (preg_match('/^([^:]+)(:[0-9]{1,5})?$$/', $$lr_host, $$m)) {
          $$lr_name = $$m[1];
        }
        $$lr_ok = in_array($$lr_name, array('lylyrose.local', 'localhost'), true)
          || false !== filter_var($$lr_name, FILTER_VALIDATE_IP);
        if (!$$lr_ok) { $$lr_host = 'lylyrose.local'; }
        $$lr_ssl = !empty($$_SERVER['HTTPS']) && $$_SERVER['HTTPS'] !== 'off';
        define('WP_HOME',    ($$lr_ssl ? 'https' : 'http') . '://' . $$lr_host);
        define('WP_SITEURL', ($$lr_ssl ? 'https' : 'http') . '://' . $$lr_host);
        define('COOKIEHASH', 'd9660ad907c1b572751a227e3acdf41e');
        define('FS_METHOD', 'direct');
        define('DISABLE_WP_CRON', true);
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_MAXTTL', 86400);
        define('WP_REDIS_GRACEFUL', true);
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content:/var/www/html/wp-content
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: 192.168.1.40:5001/curlimages/curl:8.22.0
    container_name: lylyrose-cron
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -sf -m 60 "http://wordpress/wp-cron.php?doing_wp_cron" >/dev/null 2>&1 || true
          sleep 60
        done
    depends_on:
      - wordpress
    healthcheck:
      test: ["CMD", "curl", "-f", "-o", "/dev/null", "http://wordpress/wp-cron.php?doing_wp_cron"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 40s

  redis:
    # image: 192.168.1.40:5001/library/redis:7-alpine
    image: 192.168.1.40:5001/library/redis:8.10.1-alpine
    container_name: lylyrose-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data

  db:
    # image: 192.168.1.40:5001/library/mariadb:10.11
    image: 192.168.1.40:5001/library/mariadb:13.0.2
    container_name: lylyrose-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=128M
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "db", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: 192.168.1.40:5001/library/phpmyadmin:5.2.3-apache
    container_name: lylyrose-pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8031}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  wordpress_data:
  db_data:
  redis_data: